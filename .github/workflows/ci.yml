name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Lets any failing job cancel the rest of the run.
  actions: write

jobs:
  # Kept separate from lint-and-test so a newly published advisory fails on its
  # own instead of masking the lint, test, and packaging steps that used to run
  # behind it. npm audit resolves the tree from package-lock.json alone, so this
  # job intentionally skips npm ci and needs no native build toolchain.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Use supported npm
        run: npm install --global npm@11.19.0

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Cancel remaining CI jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Use supported npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint . --max-warnings=0

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

      - name: Check repository hygiene
        run: npm run repo:check

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Build panel preview
        run: npm run build:panel

      - name: Package Windows app
        run: npx electron-builder --config electron-builder.fork.yml --config.directories.output=dist --dir --win --x64 --publish never

      - name: Smoke launch packaged Windows app
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = (Resolve-Path 'dist/win-unpacked/HA Network Dashboard.exe').Path
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -PassThru -Wait `
            -RedirectStandardOutput smoke-stdout.log -RedirectStandardError smoke-stderr.log
          Get-Content smoke-stdout.log, smoke-stderr.log -ErrorAction SilentlyContinue
          # The app cannot delete its own profile while Windows still holds its
          # file handles, so remove any retained smoke profile after exit.
          Get-ChildItem -Path $env:TEMP -Directory -Filter 'ha-desktop-widget-smoke-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Cancel remaining CI jobs
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  lint-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Use supported npm
        run: npm install --global npm@11.19.0

      - name: Install native build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxinerama-dev libxrandr-dev libxext-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libpng-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint . --max-warnings=0

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Build renderer
        run: npm run build:renderer

      # The Linux package ships the windowtolayer layer-shell helper as an extra
      # resource (electron-builder.yml), so it must exist before packaging. Pin the
      # toolchain to the same version as .mise.toml so CI verifies what a release
      # build will use instead of whatever the runner image preinstalls.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/windowtolayer

      - name: Build layer-shell helper
        run: npm run build:windowtolayer

      - name: Package Linux app
        run: npx electron-builder --config electron-builder.fork.yml --config.directories.output=dist --dir --linux --x64 --publish never

      - name: Smoke launch packaged Linux app
        timeout-minutes: 2
        run: |
          # Unpacked electron-builder output does not carry the setuid bit the
          # Chromium sandbox helper requires, so restore it before launching.
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          timeout --kill-after=5s 30s xvfb-run -a dbus-run-session -- \
            dist/linux-unpacked/ha-network-dashboard --smoke-test

      - name: Cancel remaining CI jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  package-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Use supported npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Package universal macOS app
        run: npx electron-builder --config electron-builder.fork.yml --config.directories.output=dist --dir --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke launch packaged macOS app
        shell: bash
        timeout-minutes: 2
        run: |
          "dist/mac-universal/HA Network Dashboard.app/Contents/MacOS/HA Network Dashboard" --smoke-test

      - name: Verify universal macOS app
        shell: bash
        run: |
          executable="dist/mac-universal/HA Network Dashboard.app/Contents/MacOS/HA Network Dashboard"
          architectures="$(lipo -archs "$executable")"
          if [[ " $architectures " != *" x86_64 "* || " $architectures " != *" arm64 "* ]]; then
            echo "Expected a universal macOS executable; found architectures: $architectures" >&2
            exit 1
          fi

      - name: Cancel remaining CI jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
